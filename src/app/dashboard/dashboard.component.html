<div class="dashboard">

  <app-admin-sidebar />


  <main class="main-content">

    <header class="topbar">

      <div>
        <h1>Dashboard</h1>
        <p>
          BayanihanLink — Disaster Needs Coordination Platform
        </p>
      </div>

      <div class="topbar-right">

        <app-notification-bell [circle]="true" />

        <app-admin-user-badge />

      </div>

    </header>


    <section class="dashboard-body">

      <div class="stat-grid">

        <div class="stat-card blue">
          <strong>142</strong>
          <span>Total Requests</span>
        </div>

        <div class="stat-card yellow">
          <strong>23</strong>
          <span>Pending DSWD Validation</span>
        </div>

        <div class="stat-card red">
          <strong>8</strong>
          <span>Critical Requests</span>
        </div>

        <div class="stat-card teal">
          <strong>31</strong>
          <span>Active Assistance</span>
        </div>

        <div class="stat-card green">
          <strong>88</strong>
          <span>Completed</span>
        </div>

        <div class="stat-card purple">
          <strong>54</strong>
          <span>Donation Offers</span>
        </div>

      </div>

      <div class="charts-grid">

        <app-requests-by-status />

        <app-requests-by-priority />

      </div>

      <div class="charts-grid lower-grid">
        <app-donation-offers-overview />
        <app-requests-by-disaster-type />
      </div>

      <app-recent-requests />

      <app-recent-donation-offers />

    </section>

  </main>

</div>

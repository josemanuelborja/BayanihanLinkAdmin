<section class="card">
  <header class="card-header">
    <div>
      <h2>Requests by Disaster Type</h2>
      <p>How many assistance requests are associated with each disaster.</p>
    </div>
    <app-dashboard-chart-filter (periodChange)="filterPeriod($event)" />
  </header>

  <div
    #chart
    class="chart"
    role="img"
    aria-label="Donut chart of assistance requests by disaster type"
  ></div>
</section>

<section class="card">
  <header class="card-header">
    <div>
      <h2>Requests by Status</h2>
      <p>Click a status to see its priority breakdown.</p>
    </div>
    <app-dashboard-chart-filter (periodChange)="filterPeriod($event)" />
  </header>

  <div
    #chart
    class="chart"
    role="img"
    aria-label="Requests by status, drillable by priority"
  ></div>
</section>

<div class="notification-wrap" (click)="$event.stopPropagation()">
  <button type="button" class="notification-button" [class.is-open]="open" [attr.aria-expanded]="open" aria-label="DSWD notifications" (click)="toggle()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-bell" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg>
    @if (unreadCount > 0) { <span class="notification-count">{{ unreadCount }}</span> }
  </button>

  @if (open) {
    <section class="notification-panel" aria-label="DSWD notifications">
      <header><div><h2>Notifications</h2><p>New requests and donations for review</p></div></header>
      @if (items.length === 0) {
        <p class="empty">You’re all caught up.</p>
      } @else {
        <ul>
          @for (item of items; track item.id) {
            <li>
              <button type="button" class="notification-item" (click)="openCase(item)">
                <span class="item-icon" [class.request-icon]="item.type === 'request'" [class.donation-icon]="item.type === 'donation'">
                  @if (item.type === 'request') { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14h8M8 18h6"/></svg> }
                  @else { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg> }
                </span>
                <span class="item-copy"><strong>{{ item.title }}</strong><span>{{ item.message }}</span><small>Awaiting review · Live data</small></span>
                <span class="item-chevron">›</span>
              </button>
            </li>
          }
        </ul>
      }
    </section>
  }
</div>

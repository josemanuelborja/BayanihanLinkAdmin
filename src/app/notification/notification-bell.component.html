<div class="bell-wrap" (click)="$event.stopPropagation()">
  <button
    type="button"
    class="bell-btn"
    [class.is-open]="open"
    [class.is-circle]="circle"
    [attr.aria-expanded]="open"
    aria-label="Notifications"
    (click)="toggle()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-bell" aria-hidden="true">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" />
      <path d="M9 17v1a3 3 0 0 0 6 0v-1" />
    </svg>

    @if (hasUnread()) {
      <span class="bell-count">{{ unreadCount() }}</span>
    }
  </button>

  @if (open) {
    <div class="bell-panel">
      <div class="bell-panel-head">
        <h4>Notifications</h4>

        @if (items().length > 0) {
          <button type="button" class="bell-clear" (click)="clearAll()">Clear all</button>
        }
      </div>

      @if (items().length === 0) {
        <p class="bell-empty">You're all caught up.</p>
      } @else {
        <ul class="bell-list">
          @for (item of items(); track item.id) {
            <li class="bell-item" [class.is-unread]="!item.read" (click)="markRead(item)">
              <span class="bell-item-icon bell-item-icon-{{ item.type }}">
                {{ iconFor(item.type) }}
              </span>

              <div class="bell-item-body">
                <strong>{{ item.title }}</strong>
                <p>{{ item.message }}</p>
                <small>{{ labelFor(item.type) }} · {{ item.time }}</small>
              </div>

              <button
                type="button"
                class="bell-item-remove"
                aria-label="Remove notification"
                (click)="remove(item); $event.stopPropagation()"
              >
                ✕
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>

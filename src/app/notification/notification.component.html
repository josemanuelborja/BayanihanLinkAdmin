<div class="notif-host" role="status" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
    <div class="notif notif-{{ toast.type }}">
      <span class="notif-icon">{{ iconFor(toast.type) }}</span>

      <div class="notif-body">
        <strong class="notif-label">{{ labelFor(toast.type) }}</strong>
        <p class="notif-message">{{ toast.message }}</p>
      </div>

      <button
        type="button"
        class="notif-close"
        aria-label="Dismiss notification"
        (click)="dismiss(toast.id)"
      >
        ✕
      </button>
    </div>
  }
</div>

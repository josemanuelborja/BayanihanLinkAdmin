<div class="page">

  <app-admin-sidebar />

  <main>

    <header class="topbar">

      <div>

        <h1>
          Request Verified
        </h1>

        <p>
          BayanihanLink — Disaster Needs Coordination Platform
        </p>

      </div>

      <div class="admin">

        <app-notification-bell />

        <div class="top-avatar">
          AD
        </div>

        <div>
          <strong>Admin User</strong>
          <small>Administrator</small>
        </div>

      </div>

    </header>


    <section class="content">

      <div class="success-card">

        <div class="success-icon">
          ✓
        </div>

        <h2>
          Request Verified!
        </h2>

        <p>
          The request has been verified with
          <strong>URGENT</strong>
          priority and posted to the Community
          Needs Board.
        </p>

        <div class="success-actions">

          <button
            class="primary"
            (click)="proceedToCoordination()"
          >
            Proceed to DSWD Coordination
          </button>

          <button
            (click)="backToRequests()"
          >
            Back to Request Management
          </button>

        </div>

      </div>

    </section>

  </main>

</div>
